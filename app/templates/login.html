<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TicketFlow login</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 4rem auto; padding: 0 1rem; color: #222; }
    input { width: 100%; padding: .5rem; box-sizing: border-box; margin: .5rem 0 1rem; }
    button { padding: .5rem 1rem; cursor: pointer; }
    .error { background: #fde8e8; border: 1px solid #e0a0a0; padding: .6rem; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>TicketFlow review</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/review/login">
    <label for="key">API key</label>
    <input id="key" name="key" type="password" autocomplete="off" required>
    <button type="submit">Log in</button>
  </form>
</body>
</html>
