<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="plain">
  <main class="login panel">
    <div class="panel-body">
      <a class="brand" href="/dashboard">TicketFlow</a>
      <h1>Sign in</h1>
      <p class="sub">Enter the API key for this deployment.</p>
      {% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}
      <form method="post" action="/review/login">
        <label class="field"><span>API key</span>
          <input type="password" name="key" autocomplete="off" required autofocus>
        </label>
        <button class="btn primary" type="submit">Sign in</button>
      </form>
    </div>
  </main>
</body>
</html>
