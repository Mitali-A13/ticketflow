<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TicketFlow{% endblock %}</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <a class="brand" href="/dashboard">TicketFlow</a>
    <nav aria-label="Main">
      <a href="/dashboard"{% if active == "dashboard" %} aria-current="page"{% endif %}>Overview</a>
      <a href="/demo"{% if active == "new" %} aria-current="page"{% endif %}>New email</a>
      <a href="/review"{% if active == "review" %} aria-current="page"{% endif %}>Review queue{% if nav_pending %}<span class="count">{{ nav_pending }}</span>{% endif %}</a>
    </nav>
    {% if demo_mode %}
    <p class="demo-note">Demo mode: a fake keyword model classifies emails, and data resets when the server restarts.</p>
    {% endif %}
    <div class="sidebar-foot">
      <a href="/docs">API docs</a>
      <form method="post" action="/logout"><button type="submit">Log out</button></form>
    </div>
  </aside>
  <main class="main">
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
